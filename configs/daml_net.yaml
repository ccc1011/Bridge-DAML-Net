# DAML-Net configuration

pretraining:
  base_model: roberta-base
  objective: masked_language_modelling
  masking_rate: 0.15
  min_segment_characters: 11
  train_split: 0.85
  max_length: 512
  batch_size: 8
  epochs: 5
  optimizer: AdamW
  learning_rate: 2.0e-5
  weight_decay: 0.01
  adam_epsilon: 1.0e-8
  lr_scheduler: linear
  warmup_ratio: 0.15
  max_grad_norm: 0.5

model:
  name: DAML-Net
  pretrained_encoder: pre_training_result/roberta-base/epoch5
  num_classes_rating: 5
  num_classes_component: 3
  cnn_num_filters: 100
  cnn_filter_sizes: [3, 4, 5]
  fusion_dim: 512
  dropout: 0.3

training:
  seed: 42
  batch_size: 8
  max_epochs: 50
  optimizer: AdamW
  learning_rate: 2.0e-5
  weight_decay: 0.01
  adam_epsilon: 1.0e-8
  lr_scheduler: linear
  warmup_steps: 0
  max_grad_norm: 1.0
  early_stopping_patience: 5
  early_stopping_monitor: validation_rating_accuracy
